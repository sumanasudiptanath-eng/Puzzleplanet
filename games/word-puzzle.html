<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PuzzlePlanet - Word Connect</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:20px 12px;
 font-family:Arial,sans-serif;color:white;text-align:center;
 background:linear-gradient(140deg,#151238,#39236d,#075d79);
}
.container{max-width:460px;margin:auto}
h1{font-size:30px;margin:12px 0 4px}
.sub{color:#ddd5ff;margin-bottom:20px}
.card{
 background:#ffffff14;border:1px solid #ffffff35;
 border-radius:24px;padding:20px 13px;
 box-shadow:0 12px 30px #0004;
}
.stats{display:flex;justify-content:space-around;margin-bottom:18px}
.stat{background:#ffffff18;padding:10px;border-radius:12px;min-width:85px;font-size:12px}
.stat strong{display:block;color:#ffdc76;font-size:21px;margin-top:5px}
h2{font-size:19px}
.board{
 display:grid;grid-template-columns:repeat(3,52px);
 grid-template-rows:repeat(3,52px);
 justify-content:center;gap:5px;margin:22px auto;
}
.cell{
 background:#ffffff20;border:1px solid #ffffff55;
 border-radius:8px;display:flex;align-items:center;
 justify-content:center;font-size:24px;font-weight:bold;
 color:#ffdc76;
}
.cell.filled{background:#fff;color:#33205e;border-color:#fff}
.cell.empty{background:#17132e;border-color:#17132e}
.words{
 display:flex;justify-content:center;gap:9px;
 flex-wrap:wrap;margin:15px 0;
}
.word{
 background:#ffffff16;border:1px solid #ffffff35;
 border-radius:10px;padding:9px 12px;
 font-size:15px;letter-spacing:3px;font-weight:bold;
}
.word.done{background:#176c61;color:#aaffdf;border-color:#62e6c2}
.word span{color:#ffdc76;font-size:11px;display:block;letter-spacing:0}
.letters{
 display:flex;justify-content:center;align-items:center;
 flex-wrap:wrap;gap:10px;margin:24px auto 15px;
 max-width:290px;
}
.letter{
 width:58px;height:58px;border-radius:50%;
 background:linear-gradient(145deg,#ffe18a,#ffad46);
 color:#38244e;border:3px solid #fff4;
 font-size:25px;font-weight:bold;
 box-shadow:0 5px 12px #0004;
 cursor:pointer;touch-action:none;
}
.letter.selected{background:#74e4d0;transform:scale(.92)}
.letter:disabled{opacity:.45}
.current{
 min-height:40px;font-size:24px;
 letter-spacing:8px;color:#ffdf83;
 font-weight:bold;margin:12px;
}
button.action{
 border:0;border-radius:12px;padding:13px 17px;
 margin:5px;font-size:14px;font-weight:bold;cursor:pointer;
}
.check{background:#ffca62;color:#302044}
.hint{background:#6ce0ce;color:#123d42}
.shuffle{background:#a78bfa;color:white}
.next{background:#ffca62;color:#302044}
.message{min-height:28px;font-weight:bold;margin:12px 0}
footer{color:#d3d0ee;font-size:12px;margin:20px}
.back{background:#ffffff20;color:white}
</style>
</head>
<body>
<div class="container">
<h1>🌍 PuzzlePlanet</h1>
<div class="sub">WORD CONNECT CROSSWORD 🧩</div>

<div class="card">
<div class="stats">
 <div class="stat">SCORE<strong id="score">0</strong></div>
 <div class="stat">LEVEL<strong id="level">1</strong></div>
 <div class="stat">WORDS<strong id="progress">0/3</strong></div>
</div>

<h2>Find & Connect the Words!</h2>
<p style="font-size:13px;color:#ddd5ff">Fill the crossword by connecting letters below.</p>

<div class="board" id="board"></div>
<div class="words" id="words"></div>

<p style="color:#ffdc76;font-size:13px">YOUR SELECTED WORD</p>
<div class="current" id="current">_ _ _</div>

<div class="letters" id="letters"></div>

<button class="action check" onclick="submitWord()">CHECK ✓</button>
<button class="action shuffle" onclick="shuffleLetters()">🔀 SHUFFLE</button>
<button class="action hint" onclick="hint()">💡 HINT</button>

<div class="message" id="message">Tap letters or swipe across them!</div>
<button class="action next" id="next" onclick="nextLevel()" style="display:none">NEXT LEVEL ➜</button>
</div>

<button class="action back" onclick="location.href='../index.html'">← BACK TO GAMES</button>
<footer>Think • Connect • Discover • Win! ✨</footer>
</div>

<script>
const levels=[
{
letters:"CATR",
words:[
 {word:"CAT",cells:[[0,0],[0,1],[0,2]]},
 {word:"CAR",cells:[[0,0],[1,0],[2,0]]},
 {word:"TAR",cells:[[0,2],[1,2],[2,2]]}
]
},
{
letters:"DOGT",
words:[
 {word:"DOG",cells:[[0,0],[0,1],[0,2]]},
 {word:"DOT",cells:[[0,0],[1,0],[2,0]]},
 {word:"GOT",cells:[[0,2],[1,2],[2,2]]}
]
},
{
letters:"SUNADO",
words:[
 {word:"SUN",cells:[[0,0],[0,1],[0,2]]},
 {word:"SAD",cells:[[0,0],[1,0],[2,0]]},
 {word:"NOD",cells:[[0,2],[1,2],[2,2]]}
]
}
];

let level=0,score=0,found=[],selection=[];
let pointerActive=false;

function data(){return levels[level]}

function makeBoard(){
 const board=document.getElementById("board");
 board.innerHTML="";
 let cells={};
 data().words.forEach(w=>{
  w.cells.forEach(pos=>{cells[pos.join(",")]=true});
 });
 for(let r=0;r<3;r++){
  for(let c=0;c<3;c++){
   let cell=document.createElement("div");
   cell.className="cell "+(cells[[r,c].join(",")]?"":"empty");
   cell.id="cell-"+r+"-"+c;
   board.appendChild(cell);
  }
 }
}

function renderWords(){
 const box=document.getElementById("words");
 box.innerHTML="";
 data().words.forEach(w=>{
  let d=document.createElement("div");
  d.className="word "+(found.includes(w.word)?"done":"");
  d.innerHTML=(found.includes(w.word)?w.word:w.word.split("").map(()=>" _ ").join(""))+
  "<span>"+(found.includes(w.word)?"SOLVED ✓":"WORD")+"</span>";
  box.appendChild(d);
 });
 document.getElementById("progress").textContent=found.length+"/3";
}

function renderLetters(){
 const box=document.getElementById("letters");
 box.innerHTML="";
 [...data().letters].forEach((letter,i)=>{
  let b=document.createElement("button");
  b.className="letter";
  b.textContent=letter;
  b.dataset.index=i;
  b.addEventListener("pointerdown",e=>{
   e.preventDefault();
   pointerActive=true;
   addLetter(i,b);
  });
  b.addEventListener("pointerenter",()=>{
   if(pointerActive)addLetter(i,b);
  });
  b.addEventListener("click",()=>{
   if(!pointerActive&&!b.disabled)addLetter(i,b);
  });
  box.appendChild(b);
 });
}

document.addEventListener("pointerup",()=>{pointerActive=false});

function addLetter(i,b){
 if(selection.some(x=>x.index===i)||found.length===3)return;
 selection.push({index:i,letter:b.textContent});
 b.classList.add("selected");
 b.disabled=true;
 showSelection();
}

function showSelection(){
 document.getElementById("current").textContent=
 selection.length?selection.map(x=>x.letter).join(""):"_ _ _";
}

function clearSelection(){
 selection=[];
 document.querySelectorAll(".letter").forEach(b=>{
  b.disabled=false;
  b.classList.remove("selected");
 });
 showSelection();
}

function submitWord(){
 let word=selection.map(x=>x.letter).join("");
 if(!word){message("Select some letters first!");return}
 let target=data().words.find(w=>w.word===word);
 if(target&&!found.includes(word)){
  found.push(word);
  score+=10;
  target.cells.forEach((pos,i)=>{
   let cell=document.getElementById("cell-"+pos[0]+"-"+pos[1]);
   cell.textContent=word[i];
   cell.classList.add("filled");
  });
  document.getElementById("score").textContent=score;
  renderWords();
  clearSelection();
  if(found.length===3){
   score+=20;
   document.getElementById("score").textContent=score;
   message("🏆 Amazing! Crossword completed!");
   document.getElementById("next").style.display="inline-block";
  }else message("🎉 Correct word! Well done!");
 }else if(found.includes(word)){
  message("You already found that word!");
  clearSelection();
 }else{
  message("Not a crossword word. Try again!");
  clearSelection();
 }
}

function shuffleLetters(){
 const box=document.getElementById("letters");
 let buttons=[...box.children];
 buttons.sort(()=>Math.random()-.5);
 buttons.forEach(b=>box.appendChild(b));
}

function hint(){
 let remaining=data().words.find(w=>!found.includes(w.word));
 if(!remaining){message("You found every word!");return}
 message("💡 Hint: "+remaining.word.length+" letters. Starts with "+remaining.word[0]);
}

function message(text){
 document.getElementById("message").textContent=text;
}

function nextLevel(){
 if(level<levels.length-1){
  level++;
  found=[];
  selection=[];
  document.getElementById("next").style.display="none";
  start();
  message("🚀 New level! Connect the letters!");
 }else{
  message("🌟 You are a Word Connect Champion!");
  document.getElementById("next").textContent="PLAY AGAIN ↻";
  document.getElementById("next").onclick=restart;
 }
}

function restart(){
 level=0;score=0;found=[];selection=[];
 document.getElementById("next").textContent="NEXT LEVEL ➜";
 document.getElementById("next").onclick=nextLevel;
 document.getElementById("next").style.display="none";
 start();
 message("Let's play again!");
}

function start(){
 document.getElementById("score").textContent=score;
 document.getElementById("level").textContent=level+1;
 makeBoard();
 renderWords();
 renderLetters();
 showSelection();
}
start();
</script>
</body>
</html>
