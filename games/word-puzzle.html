<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PuzzlePlanet - Word Puzzle</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#17133d,#34216b,#126b85);
 color:white;text-align:center;padding:20px 14px;
}
.container{max-width:480px;margin:auto}
h1{font-size:32px;margin:15px 0 5px}
.sub{color:#d6d3ff;margin-bottom:25px}
.card{
 background:#ffffff13;border:1px solid #ffffff35;
 border-radius:24px;padding:25px 18px;
 box-shadow:0 12px 35px #0005;
}
.stats{display:flex;justify-content:space-around;margin-bottom:25px}
.stat{background:#ffffff18;padding:12px;border-radius:14px;min-width:90px}
.stat strong{display:block;font-size:23px;color:#ffd66b}
.scramble{
 font-size:35px;letter-spacing:7px;font-weight:bold;
 color:#ffe17b;background:#ffffff15;
 padding:25px 8px;border-radius:17px;margin:18px 0;
}
input{
 width:100%;padding:16px;border-radius:13px;
 border:2px solid #aaa;background:white;
 font-size:19px;text-align:center;
 outline:none;text-transform:uppercase;
}
button{
 border:0;border-radius:13px;padding:14px 20px;
 font-size:16px;font-weight:bold;cursor:pointer;
 margin:7px;
}
.check{background:#ffca55;color:#29204c}
.hint{background:#74e2d0;color:#123c43}
.next{background:#a78bfa;color:white}
.message{min-height:28px;font-weight:bold;margin:16px 0}
.back{background:#ffffff20;color:white;margin-top:20px}
</style>
</head>
<body>
<div class="container">
<h1>🌍 PuzzlePlanet</h1>
<div class="sub">WORD PUZZLE CHALLENGE ✨</div>

<div class="card">
<div class="stats">
 <div class="stat">SCORE<strong id="score">0</strong></div>
 <div class="stat">LEVEL<strong id="level">1</strong></div>
 <div class="stat">LIVES<strong id="lives">❤️❤️❤️</strong></div>
</div>

<p>Unscramble the letters!</p>
<div class="scramble" id="scramble">PLANET</div>

<input id="answer" placeholder="Type your answer" autocomplete="off">

<div class="message" id="message">You can do it! 🚀</div>

<button class="check" onclick="checkAnswer()">CHECK ANSWER ✓</button>
<br>
<button class="hint" onclick="showHint()">💡 HINT</button>
<button class="next" onclick="nextWord()">SKIP ➜</button>
</div>

<button class="back" onclick="location.href='../index.html'">← BACK TO GAMES</button>
</div>

<script>
const words=[
["PLANET","A world in space"],
["GARDEN","A place where flowers grow"],
["PUZZLE","A game that tests your brain"],
["RAINBOW","Seven colours in the sky"],
["JUNGLE","A forest full of trees"],
["ORANGE","A juicy fruit"],
["CASTLE","A king or queen may live here"],
["MONKEY","An animal that loves climbing"],
["SUNSHINE","Light from the sun"],
["DIAMOND","A precious sparkling stone"],
["BUTTERFLY","A colourful flying insect"],
["ELEPHANT","A very large animal"],
["CHOCOLATE","A sweet treat"],
["RAINBOW","A colourful arc after rain"],
["TREASURE","Something valuable and hidden"]
];

let index=0,score=0,lives=3,level=1,usedHint=false;

function shuffle(word){
 let a=word.split("");
 for(let i=a.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 let result=a.join("");
 if(result===word && word.length>1){
  result=result.slice(1)+result[0];
 }
 return result;
}

function loadWord(){
 document.getElementById("scramble").textContent=shuffle(words[index][0]);
 document.getElementById("answer").value="";
 document.getElementById("message").textContent="You can do it! 🚀";
 document.getElementById("score").textContent=score;
 document.getElementById("level").textContent=level;
 document.getElementById("lives").textContent="❤️".repeat(lives);
 usedHint=false;
}

function checkAnswer(){
 if(lives<=0)return;
 let answer=document.getElementById("answer").value.trim().toUpperCase();
 if(!answer){
  document.getElementById("message").textContent="Please enter your answer!";
  return;
 }
 if(answer===words[index][0]){
  score+=usedHint?5:10;
  document.getElementById("score").textContent=score;
  document.getElementById("message").textContent="🎉 Correct! Amazing!";
  document.getElementById("answer").disabled=true;
  setTimeout(nextWord,1100);
 }else{
  lives--;
  document.getElementById("lives").textContent="❤️".repeat(lives);
  if(lives===0){
   document.getElementById("message").textContent="Game Over! Tap Restart to play again.";
  }else{
   document.getElementById("message").textContent="Not quite! Try again ❤️";
  }
 }
}

function showHint(){
 usedHint=true;
 document.getElementById("message").textContent="💡 "+words[index][1];
}

function nextWord(){
 if(lives<=0){
  restart();
  return;
 }
 index++;
 if(index>=words.length){
  document.getElementById("message").textContent="🏆 YOU WON! Fantastic!";
  document.getElementById("scramble").textContent="🏆";
  document.getElementById("answer").disabled=true;
  return;
 }
 level++;
 document.getElementById("answer").disabled=false;
 loadWord();
}

function restart(){
 index=0;score=0;lives=3;level=1;
 document.getElementById("answer").disabled=false;
 loadWord();
}

document.getElementById("answer").addEventListener("keydown",function(e){
 if(e.key==="Enter")checkAnswer();
});

loadWord();
</script>
</body>
</html>
