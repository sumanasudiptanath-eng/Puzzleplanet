<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PuzzlePlanet Turbo Rush</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080d19;color:white;
 font-family:Arial,sans-serif;text-align:center;
 overflow-x:hidden;touch-action:manipulation
}
h1{margin:12px 0 2px;color:#31eaff;letter-spacing:2px}
.sub{color:#aab9d1;margin:4px 0 12px}
#gameWrap{position:relative;width:min(100%,440px);margin:auto}
canvas{
 display:block;width:100%;height:auto;
 background:#101b32;touch-action:none
}
#hud{
 position:absolute;top:8px;left:8px;right:8px;
 display:flex;justify-content:space-between;gap:5px;
 pointer-events:none
}
.stat{
 background:#091321dd;border:1px solid #36dfff;
 border-radius:9px;padding:7px 9px;font-size:12px;
 font-weight:bold;text-shadow:0 0 8px #00cfff
}
#overlay{
 position:absolute;inset:0;background:#07101bdc;
 display:flex;align-items:center;justify-content:center;
 padding:15px
}
#panel{
 width:100%;background:linear-gradient(145deg,#152b49,#091323);
 border:2px solid #20dfff;border-radius:18px;
 padding:18px 13px;box-shadow:0 0 25px #00bfff55
}
#panel h2{color:#31eaff;margin:5px}
#panel p{color:#c5d5e9;font-size:14px}
select,button{
 border:0;border-radius:10px;padding:12px;
 font-weight:bold;font-size:15px
}
select{width:90%;background:#eaf6ff;color:#111;margin:7px}
button{background:#19dfff;color:#06111c;cursor:pointer}
#start{width:90%;margin-top:12px;font-size:19px;
 background:linear-gradient(90deg,#00f5b8,#19dfff);
 box-shadow:0 0 18px #00eaff77}
.smallbtn{font-size:12px;padding:9px;margin:4px}
#controls{
 width:min(100%,440px);margin:8px auto 15px;
 display:flex;justify-content:space-around;align-items:center;
 gap:8px;padding:0 8px
}
.control{
 width:30%;height:58px;font-size:23px;
 border:2px solid #45dfff;background:#102d4a;
 color:white;box-shadow:0 0 12px #00cfff44;
 touch-action:none
}
#nitro{
 width:36%;height:58px;background:linear-gradient(90deg,#ff8a00,#ff315f);
 color:white;border:2px solid #ffc15c;font-size:15px
}
#actions{margin:8px}
#actions button{margin:3px}
#message{min-height:20px;color:#ffe17a;font-size:13px}
.hidden{display:none!important}
</style>
</head>
<body>

<h1>⚡ PUZZLEPLANET</h1>
<div class="sub">TURBO RUSH • HIGHWAY CHALLENGE</div>

<div id="gameWrap">
 <canvas id="game" width="440" height="720"></canvas>

 <div id="hud">
  <div class="stat">SCORE<br><span id="score">0</span></div>
  <div class="stat">SPEED<br><span id="speed">0</span> km/h</div>
  <div class="stat">🪙 <span id="coins">0</span></div>
  <div class="stat">BEST<br><span id="best">0</span></div>
 </div>

 <div id="overlay">
  <div id="panel">
   <h2>🏁 TURBO RUSH</h2>
   <p>Race fast. Dodge traffic. Collect coins. Use nitro!</p>
   <p>CHOOSE YOUR RACING CAR</p>
   <select id="carChoice">
    <option value="#ff304f">🔥 Red Thunder</option>
    <option value="#13d9ff">💎 Blue Lightning</option>
    <option value="#b6ff36">⚡ Green Venom</option>
    <option value="#ffd12e">🌟 Golden Racer</option>
    <option value="#d46bff">💜 Purple Storm</option>
   </select>
   <p>DIFFICULTY</p>
   <select id="difficulty">
    <option value="easy">Easy Ride</option>
    <option value="normal" selected>Street Racer</option>
    <option value="hard">Turbo Expert</option>
   </select>
   <br>
   <button id="start" onclick="startGame()">▶ START RACING</button>
   <p>Use the arrows to steer and hold NITRO to boost!</p>
  </div>
 </div>
</div>

<div id="controls">
 <button class="control" id="left">◀</button>
 <button id="nitro">⚡ NITRO</button>
 <button class="control" id="right">▶</button>
</div>

<div id="actions">
 <button class="smallbtn" onclick="pauseGame()">Ⅱ PAUSE</button>
 <button class="smallbtn" onclick="showMenu()">⌂ MENU</button>
 <button class="smallbtn" onclick="toggleSound()" id="soundBtn">🔊 SOUND ON</button>
</div>
<div id="message">Ready for the highway?</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const W=440,H=720;

let running=false,paused=false,over=false;
let playerX=0,carColor="#ff304f";
let traffic=[],pickups=[],particles=[];
let score=0,coins=0,best=Number(localStorage.getItem("turboBest")||0);
let nitro=100,boosting=false,soundOn=true;
let baseSpeed=5,speed=5,distance=0;
let last=0,spawn=0,coinSpawn=0,roadMove=0;
let leftDown=false,rightDown=false;
let audio=null;

document.getElementById("best").textContent=best;

function roadAt(y){
 const t=y/H;
 const half=65+t*150;
 const center=W/2+Math.sin(distance*.0007+t*1.5)*t*25;
 return {left:center-half,right:center+half,center,half};
}

function beep(freq=500,duration=.07){
 if(!soundOn)return;
 try{
  audio=audio||new(window.AudioContext||window.webkitAudioContext)();
  if(audio.state==="suspended")audio.resume();
  const o=audio.createOscillator(),g=audio.createGain();
  o.frequency.value=freq;
  o.type="sine";
  g.gain.value=.045;
  o.connect(g);g.connect(audio.destination);
  o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
  o.stop(audio.currentTime+duration);
 }catch(e){}
}

function toggleSound(){
 soundOn=!soundOn;
 document.getElementById("soundBtn").textContent=soundOn?"🔊 SOUND ON":"🔇 SOUND OFF";
}

function rounded(x,y,w,h,r,color){
 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);
 ctx.fill();
}

function drawBackground(){
 const sky=ctx.createLinearGradient(0,0,0,420);
 sky.addColorStop(0,"#08152c");
 sky.addColorStop(.65,"#17446a");
 sky.addColorStop(1,"#ff9a54");
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

 // Distant city skyline
 for(let i=0;i<18;i++){
  let x=i*27;
  let bh=35+(i*37%65);
  ctx.fillStyle=i%2?"#152b43":"#1c3653";
  ctx.fillRect(x,275-bh,22,bh);
  ctx.fillStyle="#ffe38a";
  for(let wy=280-bh;wy<275;wy+=13){
   ctx.fillRect(x+5,wy,3,4);
   ctx.fillRect(x+14,wy,3,4);
  }
 }
 // Sun
 const glow=ctx.createRadialGradient(220,260,5,220,260,75);
 glow.addColorStop(0,"#ffe8a2");
 glow.addColorStop(1,"#ffb45a00");
 ctx.fillStyle=glow;ctx.fillRect(130,170,180,180);
}

function drawRoad(){
 drawBackground();

 // Road trapezoid
 const top=roadAt(190),bottom=roadAt(720);
 ctx.fillStyle="#303844";
 ctx.beginPath();
 ctx.moveTo(top.left,190);ctx.lineTo(top.right,190);
 ctx.lineTo(bottom.right,720);ctx.lineTo(bottom.left,720);
 ctx.closePath();ctx.fill();

 // Roadside grass and borders
 ctx.strokeStyle="#f5f5f5";ctx.lineWidth=5;
 ctx.beginPath();ctx.moveTo(top.left,190);ctx.lineTo(bottom.left,720);
 ctx.moveTo(top.right,190);ctx.lineTo(bottom.right,720);ctx.stroke();

 // Lane markings
 for(let lane=1;lane<=2;lane++){
  for(let i=0;i<10;i++){
   let y=190+((i*75+roadMove)%530);
   let r=roadAt(y);
   let x=r.left+(r.right-r.left)*lane/3;
   let size=2+(y/H)*4;
   ctx.fillStyle="#f8f5c9";
   ctx.fillRect(x-size,y,size*2,18+(y/H)*25);
  }
 }
 // Roadside lights
 for(let i=0;i<8;i++){
  let y=210+((i*85+roadMove*1.1)%500);
  let r=roadAt(y);
  [r.left-17,r.right+17].forEach(x=>{
   ctx.fillStyle="#192d45";
   ctx.fillRect(x-3,y-20,6,25);
   ctx.fillStyle="#36eaff";
   ctx.shadowBlur=12;ctx.shadowColor="#36eaff";
   ctx.beginPath();ctx.arc(x,y-23,5,0,Math.PI*2);ctx.fill();
   ctx.shadowBlur=0;
  });
 }
}

function drawCar(x,y,color,scale=1){
 ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
 // shadow
 ctx.fillStyle="#0008";ctx.beginPath();ctx.ellipse(0,30,29,10,0,0,Math.PI*2);ctx.fill();
 // wheels
 rounded(-29,-17,11,28,4,"#090d14");
 rounded(18,-17,11,28,4,"#090d14");
 rounded(-29,17,11,28,4,"#090d14");
 rounded(18,17,11,28,4,"#090d14");
 // body
 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.moveTo(-20,30);ctx.lineTo(-25,12);ctx.lineTo(-20,-25);
 ctx.lineTo(-12,-34);ctx.lineTo(12,-34);ctx.lineTo(20,-25);
 ctx.lineTo(25,12);ctx.lineTo(20,30);ctx.closePath();ctx.fill();
 // windows
 ctx.fillStyle="#152d46";
 ctx.beginPath();ctx.moveTo(-15,-13);ctx.lineTo(-11,-27);
 ctx.lineTo(11,-27);ctx.lineTo(15,-13);ctx.closePath();ctx.fill();
 ctx.fillStyle="#8ceaff";
 ctx.fillRect(-17,18,7,5);ctx.fillRect(10,18,7,5);
 ctx.fillStyle="#fff";
 ctx.fillRect(-16,-30,7,3);ctx.fillRect(9,-30,7,3);
 ctx.restore();
}

function drawTraffic(){
 traffic.forEach(t=>{
  drawCar(t.x,t.y,t.color,t.scale);
 });
}

function drawCoins(){
 pickups.forEach(c=>{
  ctx.save();ctx.translate(c.x,c.y);
  ctx.fillStyle="#ffcf25";ctx.shadowBlur=15;ctx.shadowColor="#ffcf25";
  ctx.beginPath();ctx.arc(0,0,c.r,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;ctx.fillStyle="#9b5a00";
  ctx.font="bold 15px Arial";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("$",0,1);ctx.restore();
 });
}

function drawParticles(){
 particles.forEach(p=>{
  ctx.globalAlpha=Math.max(0,p.life/25);
  ctx.fillStyle=p.color;
  ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
 });
 ctx.globalAlpha=1;
}

function drawNitroEffect(){
 if(!boosting)return;
 for(let i=0;i<15;i++){
  let x=playerX+(Math.random()-.5)*35;
  let y=630+Math.random()*90;
  ctx.fillStyle=i%2?"#27eaff":"#ff9b26";
  ctx.globalAlpha=.7;
  ctx.fillRect(x,y,3,15+Math.random()*25);
 }
 ctx.globalAlpha=1;
}

function draw(){
 drawRoad();
 drawCoins();
 drawTraffic();
 drawParticles();
 drawNitroEffect();
 drawCar(playerX,620,carColor,1.15);

 if(boosting){
  ctx.fillStyle="#fff";
  ctx.font="bold 24px Arial";
  ctx.textAlign="center";
  ctx.shadowBlur=15;ctx.shadowColor="#00eaff";
  ctx.fillText("TURBO BOOST!",220,150);
  ctx.shadowBlur=0;
 }
}

function updateHud(){
 document.getElementById("score").textContent=Math.floor(score);
 document.getElementById("coins").textContent=coins;
 document.getElementById("speed").textContent=Math.floor(speed*35);
 document.getElementById("best").textContent=best;
}

function spawnTraffic(){
 let lane=Math.floor(Math.random()*3);
 let y=205;
 let r=roadAt(y);
 let x=r.left+(r.right-r.left)*(lane+.5)/3;
 const colors=["#ff405e","#21c8ff","#ffce3c","#9b72ff","#8cff61"];
 traffic.push({x,y,color:colors[Math.floor(Math.random()*colors.length)],scale:.48});
}

function spawnCoin(){
 let lane=Math.floor(Math.random()*3);
 let y=220,r=roadAt(y);
 let x=r.left+(r.right-r.left)*(lane+.5)/3;
 pickups.push({x,y,r:10});
}

function startGame(){
 carColor=document.getElementById("carChoice").value;
 let level=document.getElementById("difficulty").value;
 baseSpeed=level==="easy"?4:level==="hard"?7:5.3;
 speed=baseSpeed;
 playerX=220;traffic=[];pickups=[];particles=[];
 score=0;coins=0;nitro=100;distance=0;
 spawn=0;coinSpawn=0;roadMove=0;
 boosting=false;paused=false;over=false;running=true;
 leftDown=false;rightDown=false;last=0;
 document.getElementById("overlay").classList.add("hidden");
 document.getElementById("message").textContent="Race on! Collect coins and dodge traffic!";
 beep(750,.15);
 updateHud();
 cancelAnimationFrame(window.gameFrame);
 window.gameFrame=requestAnimationFrame(loop);
}

function endGame(){
 running=false;over=true;boosting=false;
 best=Math.max(best,Math.floor(score));
 localStorage.setItem("turboBest",best);
 updateHud();
 beep(130,.4);
 document.getElementById("message").textContent=
  "💥 CRASH! Score: "+Math.floor(score)+" • Coins: "+coins;
 document.getElementById("overlay").classList.remove("hidden");
 document.getElementById("panel").innerHTML=
  `<h2>💥 RACE OVER!</h2>
   <p>Your score: <b>${Math.floor(score)}</b></p>
   <p>Coins collected: 🪙 ${coins}</p>
   <p>Best score: ${best}</p>
   <button id="start" onclick="startGame()">↻ RACE AGAIN</button>
   <p>Can you beat your best score?</p>`;
}

function loop(time){
 if(!running)return;
 let dt=last?Math.min((time-last)/16.67,2):1;
 last=time;

 boosting=boosting&&nitro>0;
 let target=baseSpeed+Math.min(score/400,5);
 if(boosting){speed=target*1.75;nitro=Math.max(0,nitro-.42*dt);}
 else{speed=target;nitro=Math.min(100,nitro+.09*dt);}

 if(leftDown)playerX-=6*dt;
 if(rightDown)playerX+=6*dt;
 playerX=Math.max(75,Math.min(365,playerX));

 distance+=speed*dt;
 roadMove=(roadMove+speed*dt*2.5)%75;
 score+=speed*dt*.12;

 spawn+=dt;
 coinSpawn+=dt;
 if(spawn>Math.max(24,65-speed*2.5)){
  spawnTraffic();spawn=0;
 }
 if(coinSpawn>65){
  spawnCoin();coinSpawn=0;
 }

 traffic.forEach(t=>{
  t.y+=(speed*1.25+2)*dt;
  t.scale=.48+(t.y/H)*.65;
 });
 traffic=traffic.filter(t=>t.y<780);

 pickups.forEach(c=>c.y+=(speed*1.25+2)*dt);
 pickups=pickups.filter(c=>c.y<760);

 // Collision detection
 for(const t of traffic){
  if(Math.abs(t.x-playerX)<43 && Math.abs(t.y-620)<63){
   endGame();return;
  }
 }

 // Coin collection
 pickups=pickups.filter(c=>{
  if(Math.abs(c.x-playerX)<38 && Math.abs(c.y-620)<48){
   coins++;score+=50;beep(950,.08);
   for(let i=0;i<9;i++){
    particles.push({x:c.x,y:c.y,
     color:"#ffd12e",size:3+Math.random()*4,life:25});
   }
   return false;
  }
  return true;
 });

 particles.forEach(p=>{
  p.y-=2*dt;p.life-=dt;
 });
 particles=particles.filter(p=>p.life>0);

 updateHud();
 draw();

 // Nitro meter
 document.getElementById("nitro").textContent=
  boosting?"🔥 BOOSTING":("⚡ NITRO "+Math.floor(nitro)+"%");
 window.gameFrame=requestAnimationFrame(loop);
}

function pauseGame(){
 if(running){
  running=false;paused=true;
  document.getElementById("message").textContent="Game paused. Press RESUME to continue.";
  document.querySelector("#actions button").textContent="▶ RESUME";
  draw();
 }else if(paused){
  paused=false;running=true;last=0;
  document.querySelector("#actions button").textContent="Ⅱ PAUSE";
  window.gameFrame=requestAnimationFrame(loop);
 }
}

function showMenu(){
 running=false;paused=false;over=false;
 boosting=false;
 document.getElementById("overlay").classList.remove("hidden");
 document.getElementById("panel").innerHTML=`
  <h2>🏁 TURBO RUSH</h2>
  <p>Choose your car and difficulty</p>
  <select id="carChoice">
   <option value="#ff304f">🔥 Red Thunder</option>
   <option value="#13d9ff">💎 Blue Lightning</option>
   <option value="#b6ff36">⚡ Green Venom</option>
   <option value="#ffd12e">🌟 Golden Racer</option>
   <option value="#d46bff">💜 Purple Storm</option>
  </select>
  <select id="difficulty">
   <option value="easy">Easy Ride</option>
   <option value="normal" selected>Street Racer</option>
   <option value="hard">Turbo Expert</option>
  </select>
  <button id="start" onclick="startGame()">▶ START RACING</button>
  <p>Steer, collect coins and activate nitro!</p>`;
 document.querySelector("#actions button").textContent="Ⅱ PAUSE";
 document.getElementById("nitro").textContent="⚡ NITRO";
 document.getElementById("message").textContent="Ready for another race?";
 draw();
}

function setHold(id,which){
 const el=document.getElementById(id);
 el.addEventListener("pointerdown",e=>{
  e.preventDefault();
  if(which==="left")leftDown=true;
  if(which==="right")rightDown=true;
  if(which==="nitro"&&running&&nitro>0)boosting=true;
 });
 ["pointerup","pointercancel","pointerleave"].forEach(ev=>{
  el.addEventListener(ev,()=>{
   if(which==="left")leftDown=false;
   if(which==="right")rightDown=false;
   if(which==="nitro")boosting=false;
  });
 });
}
setHold("left","left");
setHold("right","right");
setHold("nitro","nitro");

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")leftDown=true;
 if(e.key==="ArrowRight"||e.key==="d")rightDown=true;
 if(e.code==="Space"&&running)boosting=true;
});
document.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")leftDown=false;
 if(e.key==="ArrowRight"||e.key==="d")rightDown=false;
 if(e.code==="Space")boosting=false;
});

draw();
</script>
</body>
</html>
