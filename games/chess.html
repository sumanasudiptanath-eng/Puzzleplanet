<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PuzzlePlanet Chess</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:18px 10px;min-height:100vh;
 font-family:Arial,sans-serif;text-align:center;color:white;
 background:linear-gradient(140deg,#151238,#39236d,#075d79);
}
h1{margin:12px 0 5px;font-size:30px}
.sub{color:#ddd5ff;margin-bottom:20px}
.panel{
 max-width:460px;margin:auto;padding:18px 12px;
 background:#ffffff16;border:1px solid #ffffff35;
 border-radius:22px;
}
.status{
 padding:13px;background:#ffffff18;
 border-radius:12px;margin-bottom:15px;
 color:#ffe28a;font-weight:bold;
}
.board{
 width:min(94vw,420px);aspect-ratio:1;
 display:grid;grid-template-columns:repeat(8,1fr);
 margin:auto;border:5px solid #241b38;
}
.square{
 display:flex;align-items:center;justify-content:center;
 font-size:clamp(27px,8vw,43px);
 cursor:pointer;position:relative;user-select:none;
}
.light{background:#f0d9b5}
.dark{background:#9b6749}
.selected{background:#f6d64a!important}
.possible:after{
 content:"";position:absolute;width:25%;height:25%;
 border-radius:50%;background:#278c58aa;
}
.capture:after{
 content:"";position:absolute;inset:3px;
 border:4px solid #bd4747;border-radius:50%;
}
.white-piece{color:white;text-shadow:1px 2px 3px #222}
.black-piece{color:#171717;text-shadow:0 1px 2px #aaa}
.controls{
 display:flex;justify-content:center;flex-wrap:wrap;
 gap:9px;margin:18px 0;
}
button{
 border:0;border-radius:12px;padding:12px 15px;
 font-weight:bold;font-size:14px;cursor:pointer;
}
.restart{background:#ffcf69;color:#302044}
.undo{background:#75dfcc;color:#153e42}
.flip{background:#aa91fa;color:white}
.history{
 text-align:left;background:#ffffff12;
 padding:12px;border-radius:12px;
 font-size:13px;line-height:1.8;overflow-wrap:anywhere;
}
.back{background:#ffffff20;color:white;margin:16px}
</style>
</head>
<body>

<h1>🌍 PuzzlePlanet</h1>
<div class="sub">♟️ CHESS CHALLENGE ♟️</div>

<div class="panel">
 <div class="status" id="status">White's turn</div>
 <div class="board" id="board"></div>

 <div class="controls">
  <button class="restart" onclick="newGame()">🔄 NEW GAME</button>
  <button class="undo" onclick="undoMove()">↩ UNDO</button>
  <button class="flip" onclick="flipBoard()">🔃 FLIP</button>
 </div>

 <div class="history">
  <strong>📜 Move History</strong>
  <div id="history">Your moves will appear here.</div>
 </div>
 <p style="font-size:12px;color:#ddd">
  Two players · Same device<br>
  Select a piece, then tap its destination.
 </p>
</div>

<button class="back" onclick="location.href='../index.html'">
← BACK TO GAMES
</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
let game;
let selected=null;
let legalMoves=[];
let flipped=false;

const pieces={
 w:{k:"♔",q:"♕",r:"♖",b:"♗",n:"♘",p:"♙"},
 b:{k:"♚",q:"♛",r:"♜",b:"♝",n:"♞",p:"♟"}
};

function newGame(){
 if(typeof Chess==="undefined"){
  document.getElementById("status").textContent=
   "Chess library could not load. Please check your internet.";
  return;
 }
 game=new Chess();
 selected=null;
 legalMoves=[];
 flipped=false;
 render();
 updateStatus();
}

function render(){
 const board=document.getElementById("board");
 board.innerHTML="";

 let files=flipped?
  ["h","g","f","e","d","c","b","a"]:
  ["a","b","c","d","e","f","g","h"];

 let ranks=flipped?
  [1,2,3,4,5,6,7,8]:
  [8,7,6,5,4,3,2,1];

 for(let r of ranks){
  for(let f of files){
   let sq=f+r;
   let p=game.get(sq);
   let cell=document.createElement("div");
   let fi="abcdefgh".indexOf(f);

   cell.className="square "+
    ((fi+r)%2===0?"light":"dark");

   if(selected===sq)cell.classList.add("selected");

   let move=legalMoves.find(m=>m.to===sq);
   if(move)cell.classList.add(move.captured?"capture":"possible");

   if(p){
    let span=document.createElement("span");
    span.className=p.color==="w"?"white-piece":"black-piece";
    span.textContent=pieces[p.color][p.type];
    cell.appendChild(span);
   }

   cell.addEventListener("click",()=>chooseSquare(sq));
   board.appendChild(cell);
  }
 }
 showHistory();
}

function chooseSquare(sq){
 if(game.game_over())return;

 let piece=game.get(sq);

 if(selected){
  let move=legalMoves.find(m=>m.to===sq);

  if(move){
   let options={from:selected,to:sq};

   if(move.flags.includes("p")){
    let answer=prompt(
     "Promote pawn: Q=Queen, R=Rook, B=Bishop, N=Knight",
     "q"
    );
    answer=(answer||"q").toLowerCase();
    options.promotion=["q","r","b","n"].includes(answer)?
     answer:"q";
   }

   game.move(options);
   selected=null;
   legalMoves=[];
   render();
   updateStatus();
   return;
  }
 }

 if(piece&&piece.color===game.turn()){
  selected=sq;
  legalMoves=game.moves({square:sq,verbose:true});
 }else{
  selected=null;
  legalMoves=[];
 }

 render();
}

function updateStatus(){
 let s=document.getElementById("status");

 if(game.in_checkmate()){
  s.textContent="🏆 CHECKMATE! "+
   (game.turn()==="w"?"Black":"White")+" wins!";
 }else if(game.in_stalemate()){
  s.textContent="🤝 STALEMATE! Draw!";
 }else if(game.in_draw()){
  s.textContent="🤝 DRAW!";
 }else{
  s.textContent=(game.turn()==="w"?"⚪ White":"⚫ Black")+
   "'s turn"+(game.in_check()?" — CHECK!":"");
 }
}

function showHistory(){
 let h=game.history();
 document.getElementById("history").textContent=
  h.length?h.join("  "):"Your moves will appear here.";
}

function undoMove(){
 if(game.history().length){
  game.undo();
  selected=null;
  legalMoves=[];
  render();
  updateStatus();
 }
}

function flipBoard(){
 flipped=!flipped;
 render();
}

newGame();
</script>
</body>
</html>
